set -g default-terminal "tmux-256color"
set -g terminal-overrides ",xterm-256color:RGB"
set -g base-index 1 # start indexing windows at 1 instead of 0
set -g mouse on # enable mouse support
set -g escape-time 0 # remove delay for exiting insert mode with ESC in Neovim
set -g history-limit 100000 # increase history size (from 2000)
set -g renumber-windows on # number all windows when any window is closed
set -g set-clipboard on # use system clipboard
set -g status-position top # bar at the top
set -g status-interval 1

# vi keys in copy mode: v starts the selection, y copies
setw -g mode-keys vi
set -s copy-command 'wl-copy' # Ptyxis/VTE has no OSC 52 support
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# open a new session in a popup
bind P display-popup -d "#{pane_current_path}" -w 80% -h 80% -E 'tmux new-session'

# pick a session and re-open it in a popup
bind S choose-tree -Zs "display-popup -w 80% -h 80% -E \"tmux attach -d -t '%%'\""

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_left_separator "" # square caps, not rounded
set -g @session_number '#{s/\$//:session_id}' # single quotes: tmux eats \ in ""
set -g @catppuccin_session_icon " #{E:@session_number} " # session number in the box

# full working path, home shortened to ~ (tmux does not expand $HOME in formats)
# pad icons with a leading space so the glyph centres in its block,
# matching the session/window index blocks
set -g @catppuccin_directory_icon "  "
set -g @catppuccin_host_icon " 󰒋 "

set -g @catppuccin_directory_text " #{s|^/home/jorge|~|:pane_current_path}"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"

run '~/.tmux/plugins/tpm/tpm'

# themed session name (must come after the theme is loaded)
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}#[bg=default] " # bg reset + space: real gap before the window list
set -g status-right-length 100
# host block built by hand: name first, icon on the far right
set -g status-right "#[fg=#{@thm_fg},bg=#{@thm_surface_0}]#{E:@catppuccin_host_text} "
set -ag status-right "#[fg=#{@thm_crust},bg=#{E:@catppuccin_host_color}]#{@catppuccin_host_icon}"

# cwd on the left, right after the window list. -u restores the stock
# status-format first so re-sourcing this file cannot append it twice.
set -gu status-format
set -ag status-format[0] "#[align=left]#[bg=default] #{E:@catppuccin_status_directory}"

# border around the active pane
set -wg pane-border-lines heavy
set -wgF pane-active-border-style "fg=#{@thm_lavender}"
set -wgF pane-border-style "fg=#{@thm_surface_0}"
set -wg pane-border-status top
set -wg pane-border-format ""

# name unnamed sessions after the user ($USER, $USER-1, ...) so the bar
# shows [0][jorge] instead of [0][0]. Explicit names are left alone.
set-hook -g session-created "if -F '#{m:[0-9]*,#{session_name}}' { run -b \"tmux rename-session -t '#{session_id}' \\\"\$USER\\\" 2>/dev/null || tmux rename-session -t '#{session_id}' \\\"\$USER-#{session_name}\\\"\" }"
